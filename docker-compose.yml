# Local Postgres for SmartOs (PostgreSQL 18 baseline).
# Backend and frontend run locally (see README.md quickstart).
# Only infra in compose is `db`. Add services later if needed.

services:
  db:
    image: postgres:18-alpine
    container_name: smartos-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartos}
      POSTGRES_USER: ${POSTGRES_USER:-smartos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartos} -d ${POSTGRES_DB:-smartos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Optional local DB admin UI (GUI): uncommented and ready. Start with
  # `docker compose up pgadmin -d`, then open http://localhost:5050 and log in
  # with PGADMIN_DEFAULT_EMAIL below and your PGADMIN_PASSWORD from .env.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartos-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Must look like a real domain: pgAdmin rejects reserved TLDs such as .local.
      PGADMIN_DEFAULT_EMAIL: admin@smartlinepublishers.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: smartos-pgdata
