server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon closes idle connections; keep the pool modest and revalidate often.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1740000}
      keepalive-time: ${DB_KEEPALIVE_MS:120000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  clerk:
    # Clerk JWKS URL for verifying session tokens, e.g.
    # https://<frontend-api>.clerk.accounts.dev/.well-known/jwks.json
    # Leave empty to keep the legacy JWT flow only.
    jwks-url: ${CLERK_JWKS_URL:}
    # Clerk secret key for linking existing users by email on first sign-in.
    secret-key: ${CLERK_SECRET_KEY:}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-32bytes-minimum-secret}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  # Public base URL of the web app, used to build password-reset links.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    # SMTP_* is the primary configuration; legacy SPRING_MAIL_* values are
    # also read by MailConfig. Provider presets supply a host/port when omitted.
    # MAIL_ENABLED alone does not send anything: SMTP_SERVER (or a supported
    # EMAIL_PROVIDER) plus credentials are required.
    enabled: ${MAIL_ENABLED:false}
    provider: ${EMAIL_PROVIDER:}
    host: ${SMTP_SERVER:}
    port: ${SMTP_PORT:}
    username: ${SMTP_EMAIL:}
    password: ${SMTP_PASSWORD:}
    use-ssl: ${SMTP_USE_SSL:}
    # STARTTLS is used on 587; implicit TLS is used on 465. A trusted local
    # relay without STARTTLS can set SMTP_STARTTLS_REQUIRED=false.
    starttls: ${SMTP_STARTTLS:true}
    starttls-required: ${SMTP_STARTTLS_REQUIRED:true}
    timeout-ms: ${SMTP_TIMEOUT_MS:10000}
    # Providers reject a From address that differs from the authenticated
    # mailbox, so an unset MAIL_FROM falls back to SMTP_EMAIL.
    from: ${MAIL_FROM:${SMTP_EMAIL:no-reply@smartos.local}}
    # Shared branding for every outgoing email (password reset, verification,
    # welcome, notifications). Values follow the web app palette by default.
    brand:
      app-name: ${MAIL_APP_NAME:SmartOS}
      company-name: ${MAIL_COMPANY_NAME:Smartline Publishers Ltd}
      eyebrow: ${MAIL_BRAND_EYEBROW:SMARTLINE PUBLISHERS}
      # Optional absolute HTTPS URL to a raster logo (PNG/JPG, about 320x80).
      # Leave blank to use the built-in CSS wordmark, which every client renders.
      logo-url: ${MAIL_LOGO_URL:}
      primary-color: "${MAIL_PRIMARY_COLOR:#dc2626}"
      accent-color: "${MAIL_ACCENT_COLOR:#2563eb}"
      support-email: ${MAIL_SUPPORT_EMAIL:}
      support-phone: ${MAIL_SUPPORT_PHONE:}
      support-hours: ${MAIL_SUPPORT_HOURS:}
      footer-address: ${MAIL_FOOTER_ADDRESS:}
      privacy-url: ${MAIL_PRIVACY_URL:}
      terms-url: ${MAIL_TERMS_URL:}
      help-url: ${MAIL_HELP_URL:}
  security:
    # Only enable when a trusted reverse proxy overwrites X-Forwarded-For.
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    rate-limit:
      login-max-failures: 8
      login-window-seconds: 600
      forgot-max-requests: 4
      forgot-window-seconds: 1800
      passkey-max-failures: 10
      passkey-window-seconds: 600
    password-reset:
      token-ttl-minutes: 30
      # Local development only: returns the token in the API response when no
      # mail transport is configured. NEVER enable this in production.
      expose-dev-token: ${PASSWORD_RESET_EXPOSE_DEV_TOKEN:false}
  webauthn:
    # RP ID must be the registrable domain of the web app (localhost in dev).
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: ${WEBAUTHN_RP_NAME:SmartOS}
    # Exact browser origins allowed to complete WebAuthn ceremonies.
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3000}
    user-verification: ${WEBAUTHN_USER_VERIFICATION:preferred}
    timeout-ms: 60000
    challenge-ttl-seconds: 300
  cloudinary:
    # Image uploads (avatars, logos). All three must be set; when any is
    # blank the upload endpoints answer 501 and URL-based images keep working.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    max-bytes: 5242880

logging:
  level:
    "[com.smartline]": INFO
