server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # Brackets force a literal map key: without them the language server
        # parses `format_sql` as a nested path. Hibernate receives the same
        # `hibernate.format_sql` property either way.
        [format_sql]: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-32bytes-minimum-secret}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  cloudinary:
    # Image uploads (avatars, logos). All three must be set; when any is
    # blank the upload endpoints answer 501 and URL-based images keep working.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    max-bytes: 5242880

logging:
  level:
    # Brackets force a literal map key so the dotted logger name is not read
    # as a nested path. Binds to the exact same `logging.level.com.smartline`
    # property as before.
    [com.smartline]: INFO
